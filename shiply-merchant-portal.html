  const area=k=>`${path(k)} L${x(n-1)} ${H} L${L} ${H}Z`,lab=b=>size===1?dShort(b.from):`${dShort(b.from)} – ${dShort(b.to)}`,every=Math.ceil(n/5);
  return `<svg viewBox="0 0 ${W} ${H+B}" width="100%" role="img" aria-label="Cash collected and Shiply fees over time">
    ${[0,max/2,max].map(v=>`<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="var(--subtle)">${v>=1000?Math.round(v/1000)+'k':v}</text>`).join('')}
    <path d="${area('cash')}" fill="var(--c1)" opacity=".09"/><path d="${path('cash')}" fill="none" stroke="var(--c1)" stroke-width="2" stroke-linejoin="round"/>
    <path d="${area('fees')}" fill="var(--c2)" opacity=".1"/><path d="${path('fees')}" fill="none" stroke="var(--c2)" stroke-width="2" stroke-linejoin="round"/>
    ${buckets.map((b,i)=>`<g class="hit" ${tipAttr(`<b>${lab(b)}</b><br><i class=sw style=background:var(--c1)></i>Cash collected <b>${egp(Math.round(b.cash))}</b><br><i class=sw style=background:var(--c2)></i>Shiply fees <b>${egp(Math.round(b.fees))}</b>`)}><rect x="${x(i)-step/2}" y="${T}" width="${step}" height="${H-T}" fill="transparent"/><line class="xh" x1="${x(i)}" x2="${x(i)}" y1="${T}" y2="${H}" stroke="var(--line-2)"/><circle class="xh" cx="${x(i)}" cy="${y(b.cash)}" r="4.5" fill="var(--c1)" stroke="var(--surface)" stroke-width="2"/><circle class="xh" cx="${x(i)}" cy="${y(b.fees)}" r="4.5" fill="var(--c2)" stroke="var(--surface)" stroke-width="2"/></g>${(i%every===0&&n-1-i>=every*.6)||i===n-1?`<text x="${x(i)}" y="${H+17}" font-size="11" text-anchor="${i===0?'start':i===n-1?'end':'middle'}" fill="var(--subtle)">${dShort(b.from)}</text>`:''}`).join('')}
  </svg>`;
}
function cashOuts(a){
  const out=[];let acc=0;a.forEach(x=>{acc+=x.cash*.887;const wd=x.d.getDay();if(wd===1||wd===3){out.push({d:x.d,amt:acc});acc=0}});
  return out.reverse();
}

  pricing:()=>`<div class="split" style="margin-top:20px"><div class="card" style="overflow:hidden"><div class="card-h b"><h2 class="grow">Prices by zone</h2><label class="row small" style="font-weight:700">Include VAT <span class="toggle"><input type="checkbox" id="vatT"><span></span></span></label></div><div class="card-b" style="padding-bottom:0"><div class="chips">${ZONES.map((z,i)=>`<button class="chip ${PZ===i?'on':''}" data-pz="${i}">${z.zone}</button>`).join('')}</div></div>
     <div class="tbl-wrap" style="margin-top:12px"><table><thead><tr><th>Size</th><th style="text-align:right">Deliver</th><th style="text-align:right">Exchange</th><th style="text-align:right">Return</th><th style="text-align:right">Cash collection</th></tr></thead><tbody>${SIZES.map(s=>{const z=ZONES[PZ].zone,b=BASE[s]+ZONE_ADD[z];return `<tr><td><div class="cell2"><b>${s}</b><span>${SIZE_HINT[s]}</span></div></td>${[b,b+12,b-4,55+ZONE_ADD[z]].map(v=>`<td class="num pz" style="text-align:right" data-b="${v}">${v}</td>`).join('')}</tr>`}).join('')}</tbody></table></div><div class="card-b small muted">Prices in EGP.</div></div>
     <div class="grid"><div class="card stat"><span class="k"><i>${icon('cal',16)}</i>Cash-out schedule</span><b>Twice a week</b><button class="btn sm" style="align-self:flex-start" onclick="planModal()">Change</button></div><div class="card stat"><span class="k"><i>${icon('coin',16)}</i>1% collection fee</span><span class="foot">Applies to cash above EGP 3,000 per order.</span></div><div class="card stat"><span class="k"><i>${icon('box',16)}</i>Open package fee</span><span class="foot">EGP 7 when customers may check the item first.</span></div></div></div>`,
  payouts:()=>sec('Bank account','Where cash-outs are sent.',`<div class="opt"><span class="thumb">${icon('wallet',20)}</span><span class="cell2" style="flex:1"><b>Nile Commercial Bank</b><span>Nile Threads LLC · <span class="mono">EG•• •••• ••2054</span></span></span><span class="pill p-ok">Default</span></div><div><button class="btn" onclick="mockAction('Edit bank account')">Edit</button></div>`)
     +sec('Prepaid card','Receive cash-outs on a prepaid card.',`<div><button class="btn" onclick="mockAction('Add card')">${icon('plus',14,2.6)} Add card</button></div>`)
     +sec('Mobile wallet','Receive smaller cash-outs on a mobile wallet.',`<div><button class="btn" onclick="mockAction('Add mobile wallet')">${icon('plus',14,2.6)} Add wallet</button></div>`),
  billing:()=>`<div class="card" style="margin-top:20px">${emptyState('No subscriptions','Add-ons like insurance plans show up here once you turn them on.')}</div>`,
  team:()=>`<div class="card" style="margin-top:20px;overflow:hidden"><div class="card-h b"><h2 class="grow">Team</h2><button class="btn primary sm" onclick="inviteModal()">${icon('plus',14,2.6)} Invite</button></div><div class="tbl-wrap"><table><thead><tr><th>Member</th><th>Access</th><th>Status</th><th></th></tr></thead><tbody>
     <tr><td><div class="row" style="flex-wrap:nowrap"><span class="avatar">SO</span><div class="cell2"><b>Store owner</b><span>owner@nilethreads.example</span></div></div></td><td>Full access</td><td><span class="pill p-ok">Active</span></td><td></td></tr>
     <tr><td><div class="row" style="flex-wrap:nowrap"><span class="avatar" style="background:var(--blue);color:#fff">OL</span><div class="cell2"><b>Operations lead</b><span>ops@nilethreads.example</span></div></div></td><td>Orders and pickups</td><td><span class="pill p-ok">Active</span></td><td style="text-align:right"><button class="icon-btn sm" onclick="mockAction('Member options')" aria-label="Options">${icon('dots')}</button></td></tr></tbody></table></div></div>`,
  api:()=>`<div class="card" style="margin-top:20px">${emptyState('Confirm it\'s you','API keys give full access to your account. We\'ll text a one-time code to the owner\'s phone first.',`<button class="btn primary" onclick="mockAction('Send code')">Send code</button>`)}</div>`};
  return `${head('Settings','',`<button class="btn" onclick="mockAction('Prohibited items list')">Prohibited items</button>`)}${tabsHtml(STABS,ST.sub,'data-st')}<div>${T[ST.sub]()}</div>`;
};
function bindSettings(){
  document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>location.hash='settings-'+b.dataset.st);
  document.querySelectorAll('[data-pz]').forEach(b=>b.onclick=()=>{PZ=+b.dataset.pz;render()});
  const v=$('#vatT');if(v)v.onchange=()=>document.querySelectorAll('.pz').forEach(td=>td.textContent=v.checked?(td.dataset.b*1.14).toFixed(2):td.dataset.b);
}
function inviteModal(){modal('Invite a team member',`<div class="field"><label for="iE">Email</label><input id="iE" class="input" type="email"></div><div class="field"><label for="iR">Access</label><select id="iR" class="input"><option>Orders and pickups</option><option>Finance only</option><option>Full access</option></select></div>`,`<button class="btn" data-close>Cancel</button><button class="btn primary" onclick="closeAll();toast('Invite sent')">Send invite</button>`)}
function closeAccountModal(){modal('Close your account?',`<p style="margin:0">This deletes your account, order history and team access. It can't be undone.</p><div class="field"><label for="cfm">Type CLOSE to confirm</label><input id="cfm" class="input"></div>`,`<button class="btn" data-close>Keep account</button><button class="btn danger" id="cfmGo">Close account</button>`);$('#cfmGo').onclick=()=>{if($('#cfm').value.trim()!=='CLOSE'){$('#cfm').classList.add('err');$('#cfm').focus();return}closeAll();mockAction('Close account')}}

/* ───────── router ───────── */
function render(){
  closeAll();
  const h=(location.hash||'#home').slice(1);
  let route=h,html='';
  if(h.startsWith('order-')){const [,id,tab]=h.split('-');route='order';html=V.order(id,tab);}
  else if(h.startsWith('settings')){route='settings';html=V.settings(h.split('-')[1]);}
  else{if(!V[h]||h==='fulfilment')route='home';html=V[route]();}
  renderSide(route);
  const page=$('#page'),same=page.dataset.route===h;page.dataset.route=h;page.innerHTML=html;
  if(!same)window.scrollTo(0,0);
  ({orders:bindOrders,order:()=>bindOrder(h.split('-')[1]),create:bindCreate,packaging:bindPackaging,pickups:bindPickups,wallet:bindWallet,apps:bindApps,products:bindProducts,support:bindSupport,analytics:bindAnalytics,settings:bindSettings,home:bindSegs}[route]||(()=>{}))();
}
window.addEventListener('hashchange',render);
render();
applyLang();
</script>
</body>
</html>
