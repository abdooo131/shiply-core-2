  --fg:#F2F6FB; --muted:#9CAEC3; --subtle:#7488A0;
  --primary:#4A72FF; --primary-hover:#6487FF; --primary-soft:#172C5E;
  --side:#10243A; --side-fg:#AFBDCE; --side-hi:rgba(255,255,255,.07); --side-label:#6C819A; --side-on:rgba(23,75,255,.28); --side-on-fg:#FFFFFF; --side-on-ic:#DFFF00; --side-tag:#DFFF00; --side-line:#10243A; --today:#DFFF00; --c1:#4A72FF; --c2:#D9622B; --s1:#4A72FF; --s2:#3A58C0; --s3:#2B3F85;
  --ok-text:#D6F53B; --info-bg:#123B4E; --info-fg:#BDEFF8; --warn-bg:#3A2A0C; --warn-fg:#F4C771;
  --bad-bg:#43181B; --bad-fg:#FF9C93; --grey-bg:#1A314E; --grey-fg:#9CAEC3;
  --sh:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08131F; --surface:#0F2136; --surface-2:#132A44; --line:#1D3654; --line-2:#284566;
  --fg:#F2F6FB; --muted:#9CAEC3; --subtle:#7488A0;
  --primary:#4A72FF; --primary-hover:#6487FF; --primary-soft:#172C5E;
  --side:#10243A; --side-fg:#AFBDCE; --side-hi:rgba(255,255,255,.07); --side-label:#6C819A; --side-on:rgba(23,75,255,.28); --side-on-fg:#FFFFFF; --side-on-ic:#DFFF00; --side-tag:#DFFF00; --side-line:#10243A; --today:#DFFF00; --c1:#4A72FF; --c2:#D9622B; --s1:#4A72FF; --s2:#3A58C0; --s3:#2B3F85;
  --ok-text:#D6F53B; --info-bg:#123B4E; --info-fg:#BDEFF8; --warn-bg:#3A2A0C; --warn-fg:#F4C771;
  --bad-bg:#43181B; --bad-fg:#FF9C93; --grey-bg:#1A314E; --grey-fg:#9CAEC3;
  --sh:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--f);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.025em;text-wrap:balance}
h1{font-size:28px;line-height:1.15} h2{font-size:17px} h3{font-size:14.5px;letter-spacing:-.01em}
a{color:var(--primary);text-decoration:none}
[dir="rtl"],[lang="ar"]{font-family:var(--f-ar)}
.mono{font-family:var(--f-mono);font-size:12.5px;letter-spacing:-.01em}
.muted{color:var(--muted)} .subtle{color:var(--subtle)} .small{font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
:focus-visible{outline:2.5px solid var(--primary);outline-offset:2px;border-radius:8px}

/* ── shell ── */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-fg);border-right:1px solid var(--side-line);padding:22px 14px 18px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto;scrollbar-width:none}
.brand{display:block;padding:0 10px 22px}
.brand img{height:32px;width:auto;display:block}
.brand small{display:block;font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--side-tag);margin-top:4px}
.lg-d{display:none!important}
:root[data-theme="dark"] .lg-l{display:none!important}
:root[data-theme="dark"] .brand .lg-d{display:block!important}
.side .label{font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--side-label);padding:16px 12px 6px}
.nav{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:12px;color:var(--side-fg);font-weight:600;font-size:13.5px;position:relative}
.nav:hover{background:var(--side-hi);color:var(--fg)}
:root[data-theme="dark"] .nav:hover{color:#fff}
.nav.on{background:var(--side-on);color:var(--side-on-fg)}
.nav.on svg{color:var(--side-on-ic)}
.nav .badge{margin-left:auto;background:var(--bad-bg);color:var(--bad-fg);font-size:11px;font-weight:800;border-radius:20px;padding:0 7px;line-height:18px}
.help-card{margin-top:auto;background:linear-gradient(150deg,#174BFF,#0B1B66);border-radius:16px;padding:16px;color:#fff;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.help-card b{font-size:14px}
.help-card span{font-size:12px;color:#C7D3FF}
.help-card svg.deco{position:absolute;right:-34px;top:-30px;opacity:.28;pointer-events:none}
.help-card>*:not(svg){position:relative}
.gsearch .input{padding-right:52px}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:14px 28px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line)}
.top .gsearch{flex:1;max-width:520px}
.top .grow{flex:1}
.top .mlogo{display:none}
.store{display:flex;align-items:center;gap:10px;padding:4px 6px 4px 4px;border-radius:30px;border:1px solid var(--line);background:var(--surface)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--navy);color:var(--lime);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.store .cell2 b{font-size:13px}
.page{padding:26px 28px 64px;display:flex;flex-direction:column;gap:20px;max-width:1380px;width:100%}
.page-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.page-head .grow{flex:1;min-width:220px;display:flex;flex-direction:column;gap:4px}

/* ── controls ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);padding:9px 16px;border-radius:999px;cursor:pointer;font-weight:700;font-size:13.5px;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--fg)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.btn.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn.lime{background:var(--lime);border-color:var(--lime);color:var(--navy)}
.btn.lime:hover{background:#D2F000;border-color:#D2F000}
.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.outline-w{background:transparent;border-color:rgba(255,255,255,.35);color:#fff}
.btn.outline-w:hover{border-color:#fff}
.btn.danger{color:var(--bad-fg);border-color:color-mix(in srgb,var(--bad-fg) 40%,transparent)}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn[disabled]{opacity:.45;pointer-events:none}
.icon-btn{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;border:1px solid transparent;background:transparent;cursor:pointer;position:relative;color:var(--fg);flex:none}
.icon-btn:hover{background:var(--surface-2);border-color:var(--line)}
.icon-btn.sm{width:32px;height:32px}
.dot{position:absolute;top:7px;right:8px;width:9px;height:9px;border-radius:50%;background:#FF4D3D;border:2px solid var(--bg)}
.input,select.input,textarea.input{width:100%;border:1.5px solid var(--line-2);background:var(--surface);border-radius:12px;padding:10px 13px;transition:border-color .15s,box-shadow .15s}
.input::placeholder{color:var(--subtle)}
.input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
.input.err{border-color:var(--bad-fg)}
.err-msg{font-size:12px;color:var(--bad-fg);font-weight:600}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lbl{font-size:12.5px;font-weight:700}
.hint{font-size:12px;color:var(--muted)}
.search{position:relative}
.search>svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--subtle);pointer-events:none}
.search .input{padding-left:40px;border-radius:999px;background:var(--surface)}
.search kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font:600 11px var(--f-mono);color:var(--subtle);border:1px solid var(--line-2);border-radius:6px;padding:1px 6px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.chip{border:1.5px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:700;font-size:13px;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;color:var(--muted)}
.chip:hover{color:var(--fg);border-color:var(--fg)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip .count{font-size:11px;background:var(--surface-2);color:var(--muted);border-radius:20px;padding:0 7px;line-height:18px}
.chip.on .count{background:var(--lime);color:var(--navy)}
.chip.alert .count{background:var(--bad-bg);color:var(--bad-fg)}
.tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{padding:11px 14px;border:0;background:none;cursor:pointer;color:var(--muted);font-weight:700;border-bottom:2.5px solid transparent;margin-bottom:-1.5px;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--fg);border-bottom-color:var(--primary)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:700;font-size:13px}
.seg button.on{background:var(--navy);color:#fff}
.toggle{position:relative;width:42px;height:24px;flex:none;display:inline-block}
.toggle input{opacity:0;width:100%;height:100%;margin:0;cursor:pointer;position:absolute;z-index:1}
.toggle span{position:absolute;inset:0;border-radius:20px;background:var(--line-2);transition:.18s}
.toggle span::after{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle input:checked+span{background:var(--primary)}
.toggle input:checked+span::after{transform:translateX(18px)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;cursor:pointer}
.opt:hover{border-color:var(--line-2)}
.opt:has(input:checked){border-color:var(--primary);background:var(--primary-soft)}
.opt input[type=radio],.opt input[type=checkbox]{margin-top:3px;accent-color:var(--primary)}

/* ── surfaces ── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card-h{display:flex;align-items:center;gap:12px;padding:16px 20px;flex-wrap:wrap}
.card-h.b{border-bottom:1px solid var(--line)}
.card-h .grow{flex:1;min-width:0}
.card-b{padding:18px 20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.cell2{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.cell2>span:last-child:not(:first-child){font-size:12px;color:var(--muted)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td .cell2 span.num,td .cell2>span:last-child{white-space:nowrap}

/* hero */
.hero{position:relative;overflow:hidden;background:var(--navy);color:#fff;border-radius:24px;padding:30px 32px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:end;isolation:isolate}
.hero .swoosh{position:absolute;right:-60px;bottom:-40px;width:560px;z-index:-1}
.hero h1{font-size:36px;line-height:1.08;color:#fff}
.hero h1 em{font-style:normal;color:var(--lime)}
.hero h1.hero-sum{font-size:30px;line-height:1.2;max-width:22ch}
.hero h1.hero-sum a{color:#fff;text-decoration:underline;text-decoration-color:rgba(223,255,0,.7);text-decoration-thickness:3px;text-underline-offset:5px}
.hero h1.hero-sum a:hover{color:var(--lime)}
@media (max-width:860px){.hero h1.hero-sum{font-size:24px}}
.hero .eyebrow{color:var(--lime)}
.hero p{color:#C3CFDD;margin:10px 0 18px;max-width:46ch}
.hero-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hstat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:14px 16px;backdrop-filter:blur(6px);color:#fff}
.hstat:hover{background:rgba(255,255,255,.13)}
.hstat span{font-size:12px;color:#B9C7D8;font-weight:600}
.hstat b{display:block;font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
.hstat b small{font-size:13px;color:#B9C7D8;font-weight:600}

.stat{padding:18px 20px;display:flex;flex-direction:column;gap:6px;color:inherit}
.stat .k{font-size:12.5px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:8px}
.stat .k i{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary)}
.stat .v{font-size:30px;font-weight:800;letter-spacing:-.035em;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .v small{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:0}
.stat .foot{font-size:12px;color:var(--muted)}
a.card:hover{border-color:var(--line-2);transform:translateY(-1px)}
a.card{transition:transform .15s,border-color .15s}
.meter{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--primary);border-radius:6px}

.money{background:linear-gradient(120deg,#10243A 0%,#0A23A8 70%,#174BFF 100%);color:#fff;border:0;position:relative;overflow:hidden}
.money .k{color:#B9C7D8}
.money .v{color:#fff}
.money .v small{color:#B9C7D8}
.money .lines div{border-color:rgba(255,255,255,.15)}
.money .lines span:first-child{color:#B9C7D8}

/* attention list */
.attn-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 20px;border-top:1px solid var(--line)}
.attn-ic{width:38px;height:38px;border-radius:12px;background:var(--bad-bg);color:var(--bad-fg);display:grid;place-items:center}

/* table */
.tbl-wrap{overflow:auto;max-height:68vh}
table{width:100%;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;z-index:2;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;font-weight:800;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:middle;background:var(--surface)}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:color-mix(in srgb,var(--primary-soft) 45%,var(--surface))}
tbody tr.sel-on td{background:var(--primary-soft)}
td.sticky,th.sticky{position:sticky;left:0;z-index:1}
th.sticky{z-index:3}
.row-acts{display:flex;gap:2px;justify-content:flex-end}
.row-acts .hov{opacity:0;transition:opacity .12s}
tr:hover .row-acts .hov,tr:focus-within .row-acts .hov{opacity:1}
.cb{width:17px;height:17px;accent-color:var(--primary);cursor:pointer}
.oid{font-family:var(--f-mono);font-size:12.5px;color:var(--primary);font-weight:500}
.typ{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:1px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok-fg)} .p-info{background:var(--info-bg);color:var(--info-fg)}
.p-warn{background:var(--warn-bg);color:var(--warn-fg)} .p-bad{background:var(--bad-bg);color:var(--bad-fg)}
.p-grey{background:var(--grey-bg);color:var(--grey-fg)}
.p-blue{background:var(--primary-soft);color:var(--primary)}

/* mini route (brand motif: stops on a line) */
.route{display:flex;align-items:center;width:96px}
.route i{width:9px;height:9px;border-radius:50%;border:2px solid var(--line-2);background:var(--surface);flex:none;position:relative;z-index:1}
.route b{height:3px;flex:1;background:var(--line-2)}
.route .f{border-color:var(--primary);background:var(--primary)}
.route b.f{background:var(--primary)}
.route.ok i.f:last-child{background:var(--lime);border-color:var(--navy);width:11px;height:11px}
.route.back .f{border-color:var(--bad-fg);background:var(--bad-fg)} .route.back b.f{background:var(--bad-fg)}
.route.grey .f{border-color:var(--subtle);background:var(--subtle)} .route.grey b.f{background:var(--subtle)}
.prog{display:flex;flex-direction:column;gap:6px}
.att{font-size:11.5px;color:var(--muted);font-weight:600}
.att.x{color:var(--bad-fg)}

.empty{padding:52px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.empty h3{font-size:17px}
.empty p{margin:0 0 6px;color:var(--muted);max-width:42ch}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}

/* order cards (phone) */
.ocards{display:none;flex-direction:column}
.ocard{padding:14px 16px;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;cursor:pointer}
.ocard:hover{background:var(--surface-2)}

/* bulk bar */
.bulkbar{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:40;background:var(--navy);color:#fff;border-radius:999px;padding:8px 8px 8px 20px;display:flex;align-items:center;gap:8px;box-shadow:var(--sh-lg);max-width:calc(100vw - 32px);overflow-x:auto}
.bulkbar .btn{background:rgba(255,255,255,.1);border-color:transparent;color:#fff}
.bulkbar .btn:hover{background:rgba(255,255,255,.18)}
.bulkbar .btn.lime{background:var(--lime);color:var(--navy)}

/* menus, modal, toast */
.menu{position:absolute;z-index:70;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-lg);padding:6px;min-width:240px}
.menu button{display:flex;width:100%;gap:12px;align-items:center;text-align:left;border:0;background:none;padding:9px 11px;border-radius:10px;cursor:pointer;font-weight:600}
.menu button:hover{background:var(--surface-2)}
.menu button.danger{color:var(--bad-fg)}
.menu button .mi{width:34px;height:34px;border-radius:10px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;flex:none}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.kbd{margin-left:auto;font:600 11px var(--f-mono);color:var(--subtle)}
.scrim{position:fixed;inset:0;background:rgba(6,14,24,.5);backdrop-filter:blur(3px);z-index:80;display:grid;place-items:center;padding:16px;animation:fade .15s}
.modal{background:var(--surface);border-radius:22px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:var(--sh-lg);animation:pop .18s}
.modal.wide{width:min(880px,100%)}
.modal-h{display:flex;align-items:center;padding:20px 22px 6px;gap:10px}
.modal-h h2{flex:1;font-size:20px}
.modal-b{padding:14px 22px 20px;display:flex;flex-direction:column;gap:14px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px 20px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 12px 11px 18px;border-radius:999px;z-index:90;font-weight:600;box-shadow:var(--sh-lg);display:flex;gap:12px;align-items:center;animation:pop .2s;max-width:calc(100vw - 32px)}
.toast .tick{width:22px;height:22px;border-radius:50%;background:var(--lime);color:var(--navy);display:grid;place-items:center;flex:none}
.toast button{background:rgba(255,255,255,.12);border:0;color:var(--lime);font-weight:800;border-radius:999px;padding:5px 12px;cursor:pointer}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}}
@keyframes fade{from{opacity:0}}
.toast{transform:translateX(-50%)}
.drop{border:2px dashed var(--line-2);border-radius:16px;padding:26px;text-align:center;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;gap:6px}

/* order tracker */
.tracker{display:grid;grid-template-columns:repeat(4,1fr);position:relative;padding:8px 0 4px}
.tracker::before,.tracker::after{content:"";position:absolute;top:31px;left:12.5%;height:6px;border-radius:6px}
.tracker::before{right:12.5%;background:var(--surface-2);border:1px solid var(--line)}
.tracker::after{width:calc(75% * var(--p,0));background:var(--primary)}
.tracker.back::after{background:var(--bad-fg)}
.tstep{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;position:relative;z-index:1}
.tstep .nd{width:46px;height:46px;border-radius:50%;background:var(--surface);border:2px solid var(--line-2);display:grid;place-items:center;color:var(--subtle)}
.tstep.done .nd{background:var(--primary);border-color:var(--primary);color:#fff}
.tstep.now .nd{background:var(--lime);border-color:var(--navy);color:var(--navy);box-shadow:0 0 0 6px color-mix(in srgb,var(--lime) 35%,transparent)}
.tracker.back .tstep.done .nd{background:var(--bad-fg);border-color:var(--bad-fg)}
.tstep b{font-size:13px}
.tstep span{font-size:11.5px;color:var(--muted)}
.timeline{display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:20px 1fr;gap:12px;padding-bottom:18px;position:relative}
.tl::before{content:"";position:absolute;left:9px;top:16px;bottom:0;width:2px;background:var(--line)}
.tl:last-child::before{display:none}
.tl i{width:20px;height:20px;border-radius:50%;background:var(--primary-soft);border:2px solid var(--primary)}
.tl:first-child i{background:var(--lime);border-color:var(--navy)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px}
.kv div>span:first-child{display:block;font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.lines{display:flex;flex-direction:column}
.lines div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line-2)}
.lines div:last-child{border:0}
.lines .total{font-weight:800;font-size:16px}
.bar{height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--primary);border-radius:5px}
.svc{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--surface);cursor:pointer;text-align:left}
.svc:hover{border-color:var(--primary)}
.svc .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary);flex:none}
.prod-row{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.prod-row:last-child{border:0}
.thumb{width:48px;height:48px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--primary);flex:none}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line-2);border-radius:999px}
.qty button{border:0;background:none;width:30px;height:30px;cursor:pointer;font-weight:800}
.qty span{min-width:22px;text-align:center;font-weight:700}
.faq details{border-bottom:1px solid var(--line);padding:14px 0}
.faq summary{cursor:pointer;font-weight:700}
.chat{display:flex;flex-direction:column;gap:10px;padding:18px;background:var(--surface-2);min-height:320px}
.msg{max-width:78%;padding:11px 14px;border-radius:16px 16px 16px 4px;background:var(--surface);border:1px solid var(--line)}
.msg.me{align-self:flex-end;background:var(--primary);color:#fff;border-color:var(--primary);border-radius:16px 16px 4px 16px}
.tick-item{padding:14px 18px;border-top:1px solid var(--line);cursor:pointer}
.tick-item:hover{background:var(--surface-2)}
.tick-item.on{background:var(--primary-soft);box-shadow:inset 3px 0 0 var(--primary)}
.check{display:flex;gap:10px;align-items:center;padding:11px 14px;border-radius:12px;background:var(--surface-2);font-weight:600}
.check i{width:24px;height:24px;border-radius:50%;background:var(--lime);color:var(--navy);display:grid;place-items:center;flex:none}
.notif{padding:12px;border-radius:12px}
.notif:hover{background:var(--surface-2)}
.mock-tag{font-size:11px;font-weight:800;background:var(--lime);color:var(--navy);border-radius:999px;padding:4px 10px;letter-spacing:.02em}
.sec-num{width:28px;height:28px;border-radius:50%;background:var(--navy);color:var(--lime);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.sumbar{position:sticky;top:84px}
.found{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--info-bg);color:var(--info-fg);font-size:13px}
.app-tile{height:96px;display:grid;place-items:center;border-radius:var(--r) var(--r) 0 0;color:#fff;position:relative;overflow:hidden}


/* analytics */
#tip{position:fixed;z-index:95;pointer-events:none;background:#10243A;color:#fff;padding:9px 12px;border-radius:12px;font-size:12.5px;line-height:1.55;box-shadow:var(--sh-lg);max-width:270px}
#tip .tm{color:#B9C7D8}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:-1px}
.delta{font-weight:700}
.delta.good{color:var(--ok-text)} .delta.bad{color:var(--bad-fg)} .delta.flat{color:var(--muted)}
.hit{outline:none}
.xh{opacity:0;transition:opacity .1s}
.hit:hover .xh,.hit:focus .xh{opacity:1}
.an{display:flex;flex-direction:column;gap:20px}
.an h2{font-size:15.5px;font-weight:700;letter-spacing:-.01em}
.an .card{box-shadow:none}
.an .card-h{padding:18px 20px 14px}
.an .kpi{padding:18px 20px;display:flex;flex-direction:column;gap:4px}
.an .kpi>.muted{font-size:13px;font-weight:600}
.an .kpi .v{font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1.2}
.an .kpi .v small{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:0}
.an-filters{gap:8px}
.sel{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--line-2);background:var(--surface);border-radius:999px;padding:0 6px 0 12px;color:var(--muted)}
.sel:focus-within{border-color:var(--primary)}
.sel select{border:0;background:transparent;padding:8px 4px;font-weight:600;font-size:13.5px;color:var(--fg);cursor:pointer;outline:none}
.an-2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.an-2r{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}
table.plain th{background:transparent;border-top:1px solid var(--line);position:static}
table.plain td{padding:12px 14px}
.track{display:block;height:8px;border-radius:6px;background:var(--surface-2);overflow:hidden;flex:1;min-width:60px}
.track i{display:block;height:100%;border-radius:6px;background:var(--c1)}
.legend-rows{width:100%;display:flex;flex-direction:column;gap:8px}
.legend-rows>div{display:grid;grid-template-columns:1fr auto 56px;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.legend-rows b{text-align:right}
.legend-rows .tot{background:var(--surface-2);border-color:transparent;font-weight:600}
.abars{display:flex;flex-direction:column;gap:16px;padding-top:6px}
.ab{display:grid;grid-template-columns:64px 1fr 44px;gap:12px;align-items:center;outline:none}
.ab .track{height:22px;border-radius:7px}
.ab:hover .track i,.ab:focus .track i{filter:brightness(1.12)}
.ab b{text-align:right}
.ab.axis .ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--subtle)}
.ab.axis .ticks i{font-style:normal}
.bigtime{font-size:30px;font-weight:700;letter-spacing:-.03em;margin:0 0 16px}
.cols{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;height:150px}
.col{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;outline:none}
.colbar{width:100%;max-width:46px;flex:1;display:flex;align-items:flex-end}
.colbar i{display:block;width:100%;background:var(--c1);border-radius:6px 6px 2px 2px;min-height:3px}
.col:hover .colbar i,.col:focus .colbar i{filter:brightness(1.12)}
.bignum{font-size:26px;font-weight:700;letter-spacing:-.03em;color:var(--primary)}
.minis{gap:10px;margin-bottom:14px}
.minis>div{padding:10px 12px;border-radius:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:2px;min-width:0}
.minis span{font-size:12px;color:var(--muted)}
.minis .net{background:var(--primary-soft)}
.minis .net b{color:var(--primary)}
.sort-ic{margin-left:5px;opacity:.55}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--fg)}
@media (max-width:1180px){.an-2,.an-2r{grid-template-columns:1fr}}

/* wallet: balance breakdown + cash cycles */
.bd-pop{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(720px,calc(100vw - 40px));padding:8px}
.bd-col{display:flex;flex-direction:column;gap:8px;min-width:0}
.bd-h{display:flex;gap:10px;align-items:center;padding:4px 4px 8px}
.bd-h .cell2>span:last-child{font-size:12px}
.bd-ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:17px;flex:none}
.bd-ic.in,.tx-ic.in{background:var(--ok-bg);color:var(--navy)}
.bd-ic.out,.tx-ic.out{background:var(--bad-bg);color:var(--bad-fg)}
.bd-g{border:1px solid var(--line);border-radius:12px;padding:4px 0}
.bd-r{display:flex;justify-content:space-between;gap:10px;padding:6px 12px;font-size:13px}
.bd-r.sub{color:var(--muted);padding-left:24px;font-size:12.5px}
.bd-foot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:12px;background:var(--primary-soft);color:var(--primary);font-weight:700}
.tx-ic{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;font-weight:800;margin-right:8px;vertical-align:middle}
.cyc-bar{justify-content:space-between;gap:12px}
.daterange{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line-2);background:var(--surface);border-radius:999px;padding:4px 12px;color:var(--muted)}
.daterange:focus-within{border-color:var(--primary)}
.daterange label{display:inline-flex;align-items:center;gap:6px}
.daterange input{border:0;background:transparent;font-weight:700;color:var(--fg);padding:4px 0;outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.card.stat.focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
@media (max-width:640px){.bd-pop{grid-template-columns:1fr}}

/* proof of transfer */
.proof-thumb{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:1.5px dashed var(--line-2);border-radius:14px;background:var(--surface);cursor:pointer;font:inherit;color:inherit}
.proof-thumb:hover{border-color:var(--primary);background:var(--primary-soft)}
.pt-doc{width:42px;height:50px;border-radius:8px;background:#fff;border:1px solid #E2D7C3;display:grid;place-items:center;color:#174BFF;flex:none;box-shadow:0 2px 6px rgba(16,36,58,.08)}
.slip{position:relative;overflow:hidden;background:#FFFFFF;color:#10243A;border:1px solid #E7DFD0;border-radius:18px;padding:26px 28px;display:flex;flex-direction:column;gap:18px;box-shadow:0 10px 30px rgba(16,36,58,.08)}
.slip::before{content:"";position:absolute;inset:0 0 auto;height:6px;background:linear-gradient(90deg,#174BFF,#10243A)}
.sl-wm{position:absolute;right:-30px;top:44%;transform:rotate(-24deg);font:800 76px/1 var(--f);letter-spacing:.12em;color:rgba(23,75,255,.06);pointer-events:none}
.sl-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sl-title{display:flex;flex-direction:column;align-items:flex-end}
.sl-title b{font-size:16px}
.sl-title span,.sl-k,.sl-r span,.sl-amt>span:first-child,.sl-cols span{color:#5E6D7F;font-size:12.5px}
.sl-amt{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:16px 18px;border-radius:14px;background:#FFF8ED}
.sl-amt b{font-size:30px;font-weight:800;letter-spacing:-.03em}
.sl-ok{display:inline-flex;align-items:center;gap:5px;background:#DFFF00;color:#10243A;font-weight:800;font-size:12px;border-radius:999px;padding:3px 10px}
.sl-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sl-cols>div{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1px solid #EFE6D6;border-radius:12px}
.sl-k{text-transform:uppercase;letter-spacing:.08em;font-weight:800;font-size:10.5px!important}
.sl-rows{display:flex;flex-direction:column}
.sl-r{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed #E2D7C3;font-size:13.5px}
.sl-r:last-child{border:0}
.sl-note{margin:0;font-size:12px;color:#5E6D7F}
@media (max-width:560px){.slip{padding:20px}.sl-cols{grid-template-columns:1fr}.sl-wm{font-size:52px}}

/* create order: types and product picker */
.type-grid .opt{align-items:center}
.type-ic{width:34px;height:34px;border-radius:10px;background:var(--surface-2);color:var(--muted);display:grid;place-items:center;flex:none}
.type-grid .opt:has(input:checked) .type-ic{background:var(--primary);color:#fff}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.pick{display:flex;align-items:center;gap:10px;padding:10px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;text-align:left;font:inherit;color:inherit;position:relative}
.pick:hover{border-color:var(--line-2)}
.pick.on{border-color:var(--primary);background:var(--primary-soft)}
.pick[disabled]{opacity:.45;cursor:not-allowed}
.pick-ck{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center}

/* insurance badge and support chat */
.ins-badge{display:flex;align-items:center;gap:10px;margin:0 6px 14px;padding:9px 12px;border-radius:12px;border:1px solid var(--side-line);background:var(--side-hi);color:var(--side-fg);cursor:pointer;text-align:left;font:inherit}
.ins-badge svg{color:var(--ok-text);flex:none}
.ins-badge b{font-size:12.5px;color:var(--fg)}
:root[data-theme="dark"] .ins-badge b{color:#fff}
.ins-badge .cell2>span:last-child{font-size:11px}
.chat-fab{position:fixed;right:24px;bottom:24px;width:54px;height:54px;border-radius:50%;border:0;background:var(--primary);color:#fff;display:grid;place-items:center;cursor:pointer;z-index:35;box-shadow:0 10px 28px rgba(23,75,255,.35)}
.chat-fab:hover{background:var(--primary-hover)}
@media (max-width:860px){.chat-fab{bottom:88px;right:16px;width:48px;height:48px}}

/* detail drawers */
.scrim.side{place-items:stretch end;padding:0}
.modal.drawer{width:min(500px,100%);height:100%;max-height:none;border-radius:24px 0 0 24px;display:flex;flex-direction:column;animation:slidein .22s ease-out}
.modal.drawer .modal-h{padding:22px 24px 4px}
.modal.drawer .modal-b{flex:1;overflow:auto;padding:12px 24px 20px;gap:16px}
.modal.drawer .modal-b h3{margin-top:6px}
.modal.drawer .modal-f{border-top:1px solid var(--line);padding:14px 24px calc(14px + env(safe-area-inset-bottom,0px))}
@keyframes slidein{from{transform:translateX(40px);opacity:0}}
.dt-head{display:flex;flex-direction:column;gap:4px;padding:18px 20px;border-radius:18px;background:var(--surface-2)}
.dt-amt{font-size:34px;font-weight:800;letter-spacing:-.035em;line-height:1.15}
.dt-amt.pos{color:var(--ok-text)}
.dt-bal{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;color:var(--subtle)}
.dt-bal>div{display:flex;flex-direction:column;padding:10px 14px;border:1px solid var(--line);border-radius:14px}
.dt-bal span{font-size:12px;color:var(--muted)}
.dt-bal b{color:var(--fg)}
.dt-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.dt-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);color:var(--fg)}
.dt-row:first-child{border-top:0}
a.dt-row:hover{background:var(--surface-2)}
.dt-row.total{background:var(--surface-2);font-weight:800}
.dt-row.muted{color:var(--muted)}
.lines-total{display:flex;justify-content:space-between;padding:10px 0 0;border-top:1.5px solid var(--line-2);margin-top:2px;font-size:14px}
.tl.todo i{background:var(--surface);border-color:var(--line-2)}
.tl.todo b{color:var(--muted)}
button.clickcard{text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%}
.clickcard:hover{border-color:var(--primary)}
.linkish{color:var(--primary)!important;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.wl-top{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr)}
@media (max-width:1180px){.wl-top{grid-template-columns:1fr}}
@media (max-width:560px){.modal.drawer{border-radius:0}.dt-bal{grid-template-columns:1fr}.dt-bal>svg{display:none}}

/* filter pills */
.sel.sm select{padding:6px 4px;font-size:13px}
.fbar2{display:flex;flex-direction:column;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
@media (max-width:860px){.fbar2 .row{flex-wrap:wrap!important}.fbar2 .row .grow{display:none}.fbar2 .search{max-width:none!important;flex-basis:100%!important}}
.fpills{display:flex;gap:8px;flex-wrap:wrap}
.fpill{display:inline-flex;align-items:center;gap:6px;border:1.5px dashed var(--line-2);background:var(--surface);border-radius:999px;padding:6px 10px 6px 11px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.fpill:hover{border-color:var(--fg);color:var(--fg)}
.fpill b{font-weight:800;color:var(--fg)}
.fpill.always{border-style:solid}
.fpill.on{border-style:solid;border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.fpill.on b{color:var(--primary)}
.fp-pop{width:280px;max-width:calc(100vw - 32px);display:flex;flex-direction:column}
.fp-title{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 10px 6px}
.fp-list{max-height:290px;overflow:auto}
.menu .fp-opt,.fp-opt{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;cursor:pointer;font-weight:600;width:100%;border:0;background:none;text-align:left}
.fp-opt:hover,.fp-opt:focus-visible{background:var(--surface-2)}
.fp-opt[hidden]{display:none}
.fp-n{font-size:12px;color:var(--subtle);font-variant-numeric:tabular-nums;font-weight:600}
.fp-radio{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-2);flex:none}
.fp-opt.on{color:var(--primary)}
.fp-opt.on .fp-radio{border:5px solid var(--primary)}
.fp-foot{display:flex;justify-content:space-between;gap:8px;padding:10px 6px 4px;border-top:1px solid var(--line);margin-top:6px}
.fsum{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 20px;background:var(--surface-2);border-bottom:1px solid var(--line);font-size:13px}
.fsum .grow{flex:1}
.linkbtn{border:0;background:none;color:var(--primary);font-weight:700;cursor:pointer;padding:2px 4px;display:inline-flex;align-items:center;gap:4px;font-size:13px}
.linkbtn:hover{text-decoration:underline}
@media (max-width:860px){.fpills{flex-wrap:nowrap;overflow-x:auto;width:100%;scrollbar-width:none;padding-bottom:2px}}

/* Arabic, right to left */
.lang-btn{font-weight:800;font-size:15px;font-family:var(--f-ar)}
[dir="rtl"] body{font-family:var(--f-ar)}
[dir="rtl"] h1,[dir="rtl"] h2,[dir="rtl"] h3,[dir="rtl"] .stat .v,[dir="rtl"] .hero h1,[dir="rtl"] .hstat b,[dir="rtl"] .dt-amt,[dir="rtl"] .bigtime,[dir="rtl"] .bignum,[dir="rtl"] .an .kpi .v,[dir="rtl"] .eyebrow{letter-spacing:0}
[dir="rtl"] .eyebrow{text-transform:none}
[dir="rtl"] .side{border-right:0;border-left:1px solid var(--side-line)}
[dir="rtl"] .search>svg{left:auto;right:14px}
[dir="rtl"] .search .input{padding-left:13px;padding-right:40px}
[dir="rtl"] .gsearch .input{padding-left:52px}
[dir="rtl"] .search kbd{right:auto;left:12px}
[dir="rtl"] th{text-align:right}
[dir="rtl"] th[style*="text-align:right"],[dir="rtl"] td[style*="text-align:right"]{text-align:left!important}
[dir="rtl"] .menu button,[dir="rtl"] .svc,[dir="rtl"] .ins-badge,[dir="rtl"] .pick,[dir="rtl"] button.clickcard,[dir="rtl"] .proof-thumb{text-align:right}
[dir="rtl"] .tl::before{left:auto;right:9px}
[dir="rtl"] .tracker::after{left:auto;right:12.5%}
[dir="rtl"] .hero .swoosh{right:auto;left:-60px;transform:scaleX(-1)}
[dir="rtl"] .help-card svg.deco{right:auto;left:-34px;transform:scaleX(-1)}
[dir="rtl"] .chat-fab{right:auto;left:24px}
[dir="rtl"] .dot{right:auto;left:8px}
[dir="rtl"] .pick-ck{right:auto;left:8px}
[dir="rtl"] .nav .badge{margin-left:0;margin-right:auto}
[dir="rtl"] .modal.drawer{border-radius:0 24px 24px 0;animation-name:slidein-rtl}
@keyframes slidein-rtl{from{transform:translateX(-40px);opacity:0}}
[dir="rtl"] svg.flip{transform:scaleX(-1)}
[dir="rtl"] svg:not(.flip){direction:ltr}
[dir="rtl"] .msg{border-radius:16px 16px 4px 16px}
[dir="rtl"] .msg.me{border-radius:16px 16px 16px 4px}
[dir="rtl"] .tick-item.on{box-shadow:inset -3px 0 0 var(--primary)}
[dir="rtl"] .mono,[dir="rtl"] .oid,[dir="rtl"] .num{unicode-bidi:isolate}
[dir="rtl"] .mono,[dir="rtl"] .oid{direction:ltr}
[dir="rtl"] .bd-r.sub{padding-left:12px;padding-right:24px}
[dir="rtl"] .sl-title{align-items:flex-start}
[dir="rtl"] .hb b,[dir="rtl"] .ab b,[dir="rtl"] .legend-rows b{text-align:left}
[dir="rtl"] .sl-wm{right:auto;left:-30px;transform:rotate(24deg)}
[dir="rtl"] .money svg.deco{right:auto!important;left:-10px!important;transform:scaleX(-1)}
@media (max-width:860px){[dir="rtl"] .chat-fab{left:16px}}

/* bottom tab bar (phone) */
.tabbar{display:none}
.mobile-only{display:none}

@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}.sumbar{position:static}.hero{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .top{padding:10px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .top .mlogo{display:block;height:26px}
  .top .gsearch,.top .hide-sm,.store .cell2{display:none}
  .page{padding:18px 16px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .g3,.g2{grid-template-columns:1fr}
  h1{font-size:24px} .hero{padding:22px} .hero h1{font-size:28px}
  .tbl-wrap.orders{display:none}
  .ocards{display:flex}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--side);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));gap:4px}
  .tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--side-fg);font-size:10.5px;font-weight:700;background:none;border:0;cursor:pointer;padding:4px 0}
  .tabbar .on{color:var(--side-on-fg)}
  .tabbar .on svg{color:var(--side-on-ic)}
  .tabbar .fab{width:48px;height:48px;border-radius:50%;background:var(--lime);color:var(--navy);display:grid;place-items:center;margin-top:-22px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
  .bulkbar,.toast{bottom:84px}
  .mobile-only{display:block}
  .card-h .search{flex-basis:100%;max-width:none!important}
  :root[data-theme="dark"] .top .mlogo.lg-d{display:block!important}
  .attn-row{grid-template-columns:auto minmax(0,1fr)}
  .attn-row>.row{grid-column:1/-1}
}
@media (max-width:480px){.g4{grid-template-columns:1fr 1fr}.hero-stats{grid-template-columns:1fr 1fr}.stat .v{font-size:24px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const AR_SUFFIX=[[" active"," نشط"],[" zone"," (منطقة)"],[" orders"," طلب"],[" needs you"," يحتاجك"],[" canceled"," أُلغي"],[" created for "," أُنشئ لـ "],[" is coming back to you"," في طريق العودة إليك"],[" is now active"," أصبح نشطًا"],[" is now inactive"," أصبح غير نشط"],[": not connected in this mockup",": غير متصل في هذا النموذج"]];
const latin=s=>/[A-Za-z]{2}/.test(s);
const nameish=s=>!latin(s)||/^[A-Z]{1,3}$/.test(s)||/^[A-Z][a-z]+( [A-Z][a-z]+)*$/.test(s)||/^(TX|PRD|TK|NT|CO|NCB|PAY)-/.test(s)||/^[\d\s#+•·.,:()\-–/]+$/.test(s)||/@/.test(s);
function trCore(t,depth=0){
  if(!t||!latin(t))return t;
  if(depth>4)return null;
  const nums=[];const key=t.replace(/\d[\d,.]*/g,m=>{nums.push(m);return '#'});
  if(AR[key]!=null){let i=0;return AR[key].replace(/#/g,()=>nums[i++]??'')}
  if(t.startsWith('· ')){const r=trCore(t.slice(2),depth+1);if(r!=null)return '· '+r}
  let mm=t.match(/^(\d+)× (.+)$/);if(mm){const r=trCore(mm[2],depth+1);if(r!=null)return mm[1]+'× '+r}
  mm=t.match(/^(.+) \((.+)\)$/);if(mm){const a=trCore(mm[1],depth+1)??(nameish(mm[1])?mm[1]:null),b=trCore(mm[2],depth+1)??(nameish(mm[2])?mm[2]:null);if(a!=null&&b!=null)return a+' ('+b+')'}
  for(const [en,ar] of AR_PREFIX){
    if(en.includes('#')){const re=new RegExp('^'+en.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/#/g,'([\\d,.]+)')+'(.*)$');const m=t.match(re);if(m){const rest=m[2]?(trCore(m[2].trim(),depth+1)??m[2].trim()):'';return ar.replace('#',m[1])+(rest?' '+rest:'')}continue}
    if(t.startsWith(en)&&t.length>en.length){const rest=t.slice(en.length);const r=trCore(rest,depth+1);if(r!=null||nameish(rest))return ar+(r??rest)}
  }
  for(const [en,ar] of AR_SUFFIX){const i=t.indexOf(en);if(i>0){const a=t.slice(0,i),b=t.slice(i+en.length);const ta=trCore(a,depth+1)??(nameish(a)?a:null),tb=b?(trCore(b,depth+1)??(nameish(b)?b:null)):'';if(ta!=null&&tb!=null)return (ta+ar+tb).trim()}}
  for(const [sep,arSep] of [[' · ',' · '],[' → ',' ← '],[', ','، '],[' – ',' – '],[': ',': '],['. ','. ']]){
    if(t.includes(sep)){const parts=t.split(sep);const tp=parts.map(p=>{const q=p.trim();return trCore(q,depth+1)??(nameish(q)?q:null)});if(tp.every(x=>x!=null))return tp.join(arSep)}
  }
  let r=t.replace(/\b(Mon|Tue|Wed|Thu|Fri|Sat|Sun|mon|tue|wed|thu|fri|sat|sun)\b/g,m=>DAYS[m]).replace(/\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec|nov|oct)\b/g,m=>MONTHS[m]).replace(/(\d)\s?AM\b/g,'$1 ص').replace(/(\d)\s?PM\b/g,'$1 م').replace(/EGP\s?([\d,.]+)/g,'$1 ج.م').replace(/\bEGP\b/g,'ج.م').replace(/, /g,'، ').replace(/\bof\b/g,'من');
  if(r!==t&&!latin(r))return r;
  if(r!==t){const again=trCore(r,depth+1);if(again!=null&&!latin(again))return again}
  return null;
}
const trText=s=>{if(LANG!=='ar'||!s||!latin(s))return s;const lead=s.match(/^\s*/)[0],trail=s.match(/\s*$/)[0],core=s.trim();const r=trCore(core);return r==null?s:lead+r+trail};
/* apply to the page: text nodes, placeholders, labels, titles */
const ORIG=new WeakMap(),DONE=new WeakMap();
function trNode(n){if(DONE.get(n)===n.nodeValue)return;const v=n.nodeValue,o=ORIG.has(n)?ORIG.get(n):v;if(!ORIG.has(n))ORIG.set(n,v);const t=trText(o);if(t!==v){n.nodeValue=t}DONE.set(n,n.nodeValue)}
function trEl(el){for(const a of ['placeholder','aria-label','title']){if(!el.hasAttribute||!el.hasAttribute(a))continue;const k='data-en-'+a;if(!el.hasAttribute(k))el.setAttribute(k,el.getAttribute(a));const t=trText(el.getAttribute(k));if(el.getAttribute(a)!==t)el.setAttribute(a,t)}}
function trTree(root){
  if(LANG!=='ar'||!root)return;
  if(root.nodeType===3){trNode(root);return}
  if(root.nodeType!==1||root.tagName==='SCRIPT'||root.tagName==='STYLE')return;
  trEl(root);root.querySelectorAll('[placeholder],[aria-label],[title]').forEach(trEl);
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement&&!['SCRIPT','STYLE','TEXTAREA'].includes(n.parentElement.tagName)?1:2});let n;while(n=w.nextNode())trNode(n);
}
function untrTree(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){if(ORIG.has(n)){n.nodeValue=ORIG.get(n);ORIG.delete(n);DONE.delete(n)}}
  root.querySelectorAll('*').forEach(el=>{for(const a of ['placeholder','aria-label','title']){const k='data-en-'+a;if(el.hasAttribute(k)){el.setAttribute(a,el.getAttribute(k));el.removeAttribute(k)}}});
}
const trObserver=new MutationObserver(ms=>{if(LANG!=='ar')return;for(const m of ms){if(m.type==='characterData')trNode(m.target);else m.addedNodes.forEach(trTree)}});
function applyLang(){
  document.documentElement.lang=LANG;document.documentElement.dir=LANG==='ar'?'rtl':'ltr';
  if(LANG==='ar'){trTree(document.body);trObserver.observe(document.body,{childList:true,subtree:true,characterData:true})}
  else{trObserver.disconnect();untrTree(document.body)}
  const b=document.getElementById('langBtn');if(b){b.textContent=LANG==='ar'?'EN':'ع';b.setAttribute('aria-label',LANG==='ar'?'Switch to English':'التبديل إلى العربية');b.title=b.getAttribute('aria-label')}
}
function setLang(l){LANG=l;try{localStorage.setItem('shiply-lang',l)}catch(e){}trObserver.disconnect();untrTree(document.body);if(typeof render==='function')render();applyLang()}

function menuAt(anchor,html,alignRight=false){
  closeAll();const m=document.createElement('div');m.className='menu';m.innerHTML=html;document.body.appendChild(m);
  const r=anchor.getBoundingClientRect();let top=r.bottom+window.scrollY+8;
  if(r.bottom+m.offsetHeight+16>innerHeight&&r.top>m.offsetHeight)top=r.top+window.scrollY-m.offsetHeight-8;
  m.style.top=top+'px';const left=alignRight?r.right-m.offsetWidth:r.left;m.style.left=Math.max(8,Math.min(left,innerWidth-m.offsetWidth-8))+'px';
  setTimeout(()=>document.addEventListener('click',function h(e){if(!m.contains(e.target)){m.remove();document.removeEventListener('click',h)}}),0);
  return m;
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll();

  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='o'){e.preventDefault();location.hash='create'}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='m'){e.preventDefault();bulkModal()}});

function fpText(d,val){
  if(d.type==='multi'){if(!val||!val.length)return '';const ls=val.map(v=>(d.opts().find(o=>o[0]===v)||[v,v])[1]);return ls[0]+(ls.length>1?` +${ls.length-1}`:'')}
  if(val===d.def&&!d.always)return '';const o=d.opts().find(o=>o[0]===val);return o?o[1]:'';
}
function fpills(defs,state,ns){
  return Object.entries(defs).map(([k,d])=>{const t=fpText(d,state[k]),on=t&&!d.always;
    return `<button type="button" class="fpill ${on?'on':''} ${d.always?'always':''}" data-fp="${ns}:${k}" aria-haspopup="true">${icon(d.icon,15)}<span>${d.always?'':d.label}${t?`${d.always?'':': '}<b>${esc(t)}</b>`:''}</span>${icon('chev',14,2.2)}</button>`}).join('');

function fpOpen(anchor,d,val,onApply,countFn){

    m.onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;m.remove();onApply(b.dataset.v)};
    setTimeout(()=>m.querySelector('.fp-opt.on,.fp-opt')?.focus(),20);return;
  }
  const cur=new Set(val||[]);
  const m=menuAt(anchor,`<div class="fp-pop"><div class="fp-title">${d.label}</div>${d.search?`<div class="search" style="margin:0 4px 6px">${icon('search',15)}<input class="input" placeholder="Search" aria-label="Search ${esc(d.label)}"></div>`:''}
    <div class="fp-list">${d.opts().map(([v,l])=>`<label class="fp-opt" data-l="${esc(l.toLowerCase())}"><input type="checkbox" class="cb" value="${esc(v)}" ${cur.has(v)?'checked':''}><span style="flex:1">${l}</span>${countFn?`<span class="fp-n">${countFn(v)}</span>`:''}</label>`).join('')}</div>
    <div class="fp-foot"><button class="btn ghost sm" data-clear>Clear</button><button class="btn primary sm" data-apply>Apply</button></div></div>`);
  const sb=m.querySelector('.search input');if(sb){setTimeout(()=>sb.focus(),20);sb.oninput=()=>m.querySelectorAll('.fp-opt').forEach(o=>o.hidden=!o.dataset.l.includes(sb.value.toLowerCase()));sb.onkeydown=e=>{if(e.key==='Enter')m.querySelector('[data-apply]').click()}}
  m.querySelector('[data-clear]').onclick=()=>{m.remove();onApply([])};
  m.querySelector('[data-apply]').onclick=()=>{const v=[...m.querySelectorAll('input[type=checkbox]:checked')].map(c=>c.value);m.remove();onApply(v)};
}

function matchF(o,f){
  if(f.date!=='any'){const days=(new Date(TODAY.toDateString())-new Date(o.created.toDateString()))/DAY;if(f.date==='today'?days>0:days>=+f.date)return false}
  if(f.gov.length&&!f.gov.includes(o.gov))return false;
  if(f.type.length&&!f.type.includes(o.type))return false;
  if((f.pay==='cod'&&!o.cod)||(f.pay==='prepaid'&&o.cod))return false;
  if(f.payout.length&&!f.payout.includes(o.payout))return false;
  if((f.tries==='0'&&o.attempts)||(f.tries==='some'&&!(o.attempts>=1&&o.attempts<=2))||(f.tries==='3'&&o.attempts!==3))return false;
  return true;
}
function filteredOrders(f=OF.f,tab=OF.tab){

    if(q&&!(o.id.includes(q)||o.name.toLowerCase().includes(q)||o.ref.toLowerCase().includes(q)))return false;
    return matchF(o,f);});
  const by={updated:(a,b)=>b.updated-a.updated,new:(a,b)=>b.created-a.created,old:(a,b)=>a.created-b.created,cash:(a,b)=>b.cod-a.cod}[OF.sort];

  const m=menuAt(anchor,`<div class="fp-pop"><div class="fp-title">Saved views</div>${all.map((v,i)=>`<div class="row" style="flex-wrap:nowrap;gap:0"><button class="fp-opt" data-vi="${i}">${icon(v.preset?'sparkle':'doc',15)}<span style="flex:1">${esc(v.name)}</span></button>${v.preset?'':`<button class="icon-btn sm" data-del="${i-PRESET_VIEWS.length}" aria-label="Delete view ${esc(v.name)}">${icon('x',13,2.4)}</button>`}</div>`).join('')}
    <div class="fp-foot"><span class="small subtle" style="align-self:center">${VIEWS.length?'':'Your saved views show here'}</span><button class="btn sm" data-save ${nActive(OF.f)||OF.q?'':'disabled'}>${icon('plus',13,2.6)} Save current</button></div></div>`,true);
  m.onclick=e=>{const v=e.target.closest('[data-vi]'),d=e.target.closest('[data-del]'),sv=e.target.closest('[data-save]');
    if(d){e.stopPropagation();VIEWS.splice(+d.dataset.del,1);saveViews();m.remove();viewsMenu(anchor);return}
    if(v){const x=all[+v.dataset.vi];m.remove();OF.f={...OF_EMPTY(),...JSON.parse(JSON.stringify(x.f))};OF.tab=x.tab||'all';OF.q=x.q||'';OF.page=0;render();toast(`Showing “${x.name}”`);return}
    if(sv){m.remove();saveViewModal()}};
}
function saveViewModal(){
  const auto=Object.entries(OF.f).map(([k,v])=>fpText(OFDEF[k],v)).filter(Boolean).join(' · ')||OF.q;
  modal('Save this view',`<p class="muted" style="margin:0">Keep these filters one click away on the Orders page.</p><div class="field"><label for="vn">View name</label><input id="vn" class="input" value="${esc(auto)}" maxlength="40"></div>`,`<button class="btn" data-close>Cancel</button><button class="btn primary" id="vnGo">Save view</button>`);
  $('#vnGo').onclick=()=>{const n=$('#vn').value.trim();if(!n){$('#vn').classList.add('err');return}VIEWS.push({name:n,f:JSON.parse(JSON.stringify(OF.f)),tab:OF.tab,q:OF.q});saveViews();closeAll();toast(`View “${n}” saved`)};
}
V.orders=()=>{
  const list=filteredOrders(),per=20,pages=Math.max(1,Math.ceil(list.length/per));OF.page=Math.min(OF.page,pages-1);
  const rows=list.slice(OF.page*per,OF.page*per+per);
  const count=k=>filteredOrders(OF.f,k).length;
  const nf=nActive(OF.f);
  const allOn=rows.length&&rows.every(o=>OF.sel.has(o.id));
  return `${head('Orders',`${S.orders.length} orders · ${S.orders.filter(o=>o.status==='Out for delivery').length} out for delivery right now`,`<button class="btn" onclick="printNew()">${icon('print',16)} Print labels</button><button class="btn" onclick="bulkModal()">${icon('upload',16)} Bulk upload</button><a class="btn primary" href="#create">${icon('plus',16,2.6)} Create order</a>`)}
  <div class="chips" role="tablist">${OTABS.map(([k,l])=>{const c=count(k);return `<button class="chip ${OF.tab===k?'on':''} ${k==='Awaiting your action'||k==='Unclear address'?'alert':''}" data-otab="${k}" role="tab" aria-selected="${OF.tab===k}">${l}<span class="count">${c}</span></button>`}).join('')}</div>
  <div class="card" style="overflow:hidden">
    <div class="fbar2">
      <div class="row" style="flex-wrap:nowrap;gap:10px">
      <div class="search" style="flex:1;max-width:420px">${icon('search',16)}<input class="input" id="oq" placeholder="Order ID, customer or reference" value="${esc(OF.q)}" aria-label="Search orders"></div>
      <div class="grow" style="flex:1"></div>
      <button class="btn sm" id="viewsBtn">${icon('doc',15)} Views${VIEWS.length?` <span class="pill p-blue" style="padding:0 7px">${VIEWS.length}</span>`:''}</button>
      <label class="sel sm">${icon('filter',14)}<select id="oSort" aria-label="Sort orders">${OSORT.map(([v,l])=>`<option value="${v}" ${OF.sort===v?'selected':''}>${l}</option>`).join('')}</select></label>
      <button class="btn sm" onclick="mockAction('Export ${list.length} orders')">${icon('down',15)} Export</button>
      </div>
      <div class="fpills">${fpills(OFDEF,OF.f,'o')}</div>
    </div>
    ${nf||OF.q?`<div class="fsum"><span><b class="num">${list.length}</b> of ${S.orders.length} orders match</span>${OF.q?`<span class="pill p-blue">“${esc(OF.q)}” <button class="linkbtn" data-clrq aria-label="Clear search">${icon('x',12,2.6)}</button></span>`:''}<span class="grow"></span><button class="linkbtn" id="saveView">${icon('plus',13,2.6)} Save as view</button><button class="linkbtn" id="fClearAll">Clear all</button></div>`:''}
    <div class="tbl-wrap orders"><table>
      <thead><tr><th class="sticky" style="width:44px"><input type="checkbox" class="cb" id="selAll" ${allOn?'checked':''} aria-label="Select all on this page"></th><th>Order</th><th>Customer</th><th>Destination</th><th style="text-align:right">Cash to collect</th><th>Progress</th><th>Payout</th><th>Expected</th><th></th></tr></thead>
      <tbody>${rows.map(o=>`<tr class="click ${OF.sel.has(o.id)?'sel-on':''}" data-id="${o.id}">
        <td class="sticky"><input type="checkbox" class="cb sel" data-id="${o.id}" ${OF.sel.has(o.id)?'checked':''} aria-label="Select order ${o.id}"></td>
        <td><div class="cell2"><span class="oid">${o.id}</span><span><span class="typ">${o.type==='Cash collection'?'Collect':o.type}</span> ${o.size}</span></div></td>
        <td style="max-width:200px"><div class="cell2"><b class="ell">${o.name}</b><span class="num">${o.phone}</span></div></td>
        <td><div class="cell2"><span>${o.area}</span><span>${o.gov}</span></div></td>
        <td style="text-align:right"><div class="cell2"><b class="num">${o.cod?egp(o.cod):'—'}</b><span>${o.cod?'Cash on delivery':'Prepaid'}</span></div></td>
        <td><div class="prog">${route(o)}<span class="row" style="gap:8px">${pill(o.status)}${o.attempts?`<span class="att ${o.attempts===3&&o.status!=='Delivered'?'x':''}">${o.attempts}/3 tries</span>`:''}</span></div></td>
        <td>${payPill(o.payout)}</td>
        <td><div class="cell2"><span>${['Delivered','Returned','Canceled'].includes(o.status)?rel(o.updated):rel(o.eta)}</span><span>${o.status==='Delivered'?'Delivered':['Returned','Canceled'].includes(o.status)?'Closed':'Created '+rel(o.created).toLowerCase()}</span></div></td>
        <td><div class="row-acts"><button class="icon-btn sm hov" data-q="print" aria-label="Print label">${icon('print',16)}</button><button class="icon-btn sm hov" data-q="track" aria-label="Track">${icon('globe',16)}</button><button class="icon-btn sm rowmenu" aria-label="More actions for ${o.id}">${icon('dots')}</button></div></td></tr>`).join('')||`<tr><td colspan="9">${emptyState('No orders match','Try another status or clear your search and filters.',`<button class="btn" onclick="resetOF()">Clear all filters</button>`)}</td></tr>`}</tbody>
    </table></div>
    <div class="ocards">${rows.map(o=>`<div class="ocard" data-id="${o.id}"><div class="cell2"><b>${o.name}</b><span>${o.area}, ${o.gov}</span></div><b class="num" style="text-align:right">${o.cod?egp(o.cod):'Prepaid'}</b><div class="row" style="gap:8px">${pill(o.status)}<span class="oid">${o.id}</span></div><div style="justify-self:end">${route(o)}</div></div>`).join('')||emptyState('No orders match','Try another status or clear your search.')}</div>
    <div class="pager"><span>${list.length?`${OF.page*per+1}–${Math.min(list.length,(OF.page+1)*per)} of ${list.length}`:'0 orders'}</span><button class="btn sm" id="pPrev" ${OF.page===0?'disabled':''}>${icon('back',14)} Prev</button><button class="btn sm" id="pNext" ${OF.page>=pages-1?'disabled':''}>Next</button></div>
  </div>
  ${OF.sel.size?`<div class="bulkbar" role="toolbar" aria-label="Selected orders"><b>${OF.sel.size} selected</b><button class="btn sm" onclick="mockAction('Print ${OF.sel.size} labels')">${icon('print',14)} Print labels</button><button class="btn sm lime" onclick="pickupModal()">${icon('truck',14)} Request pickup</button><button class="btn sm" onclick="bulkCancel()">Cancel orders</button><button class="icon-btn sm" style="color:#fff" onclick="OF.sel.clear();render()" aria-label="Clear selection">${icon('x',16)}</button></div>`:''}`;
};
function bulkCancel(){const ids=[...OF.sel],prev=ids.map(id=>[id,S.orders.find(o=>o.id===id).status]);ids.forEach(id=>{const o=S.orders.find(x=>x.id===id);if(!['Delivered','Returned'].includes(o.status))o.status='Canceled'});OF.sel.clear();render();toast(`${ids.length} orders canceled`,()=>{prev.forEach(([id,s])=>S.orders.find(o=>o.id===id).status=s);render()})}
function printNew(){const n=S.orders.filter(o=>!o.printed&&!['Delivered','Returned','Canceled'].includes(o.status));modal('Print labels',`<p style="margin:0">${n.length} active orders don't have a label printed yet.</p><label class="opt"><input type="radio" name="pf" checked><span class="cell2"><b>Thermal label</b><span>10 × 15 cm, one per sticker</span></span></label><label class="opt"><input type="radio" name="pf"><span class="cell2"><b>A4 paper</b><span>Two labels per page</span></span></label>`,`<button class="btn" data-close>Cancel</button><button class="btn primary" onclick="closeAll();mockAction('Print ${n.length} labels')">Print ${n.length} labels</button>`)}
function orderMenu(anchor,id){
  const o=S.orders.find(x=>x.id===id),closed=['Delivered','Canceled','Returned'].includes(o.status);
  const acts=[["Track order","globe"],["Print label","print"],["Edit order","doc"],["Reschedule","cal"],["Add note","chat"],["Reorder","box"],["Upload item value proof","upload"],["Download proof of delivery","down"]];
  const m=menuAt(anchor,acts.map(([a,i])=>`<button data-a="${a}">${icon(i,16)} ${a}</button>`).join('')+`<hr><button class="danger" data-a="Cancel order" ${closed?'disabled style="opacity:.4"':''}>${icon('x',16)} Cancel order</button>`,true);
  m.onclick=e=>{const a=e.target.closest('button')?.dataset.a;if(!a)return;m.remove();
    if(a==='Track order')location.hash='order-'+id+'-tracking';else if(a==='Edit order')location.hash='order-'+id;else if(a==='Add note')noteModal(id);
    else if(a==='Reschedule')resolve(id,'reschedule');
    else if(a==='Cancel order')modal('Cancel this order?',`<p style="margin:0">Order <span class="mono">${id}</span> for ${o.name} will be canceled. If a courier already has it, it comes back to you.</p>`,`<button class="btn" data-close>Keep order</button><button class="btn danger" onclick="cancelOrder('${id}')">Cancel order</button>`);
    else mockAction(a)};
}
function cancelOrder(id){const o=S.orders.find(x=>x.id===id),p=o.status;o.status='Canceled';closeAll();render();toast(`Order ${id} canceled`,()=>{o.status=p;render()})}
function noteModal(id){modal('Add note',`<div class="field"><label for="nt">Note for your team</label><textarea id="nt" class="input" rows="3" placeholder="Not printed on the label"></textarea></div>`,`<button class="btn" data-close>Cancel</button><button class="btn primary" onclick="closeAll();toast('Note saved')">Save note</button>`)}
function bindOrders(){
  document.querySelectorAll('[data-otab]').forEach(b=>b.onclick=()=>{OF.tab=b.dataset.otab;OF.page=0;render()});
  const q=$('#oq');q.oninput=()=>{OF.q=q.value;OF.page=0;const pos=q.selectionStart;render();const n=$('#oq');n.focus();n.setSelectionRange(pos,pos)};
  $('#pPrev').onclick=()=>{OF.page--;render()};$('#pNext').onclick=()=>{OF.page++;render()};
  bindPills('o',OFDEF,()=>OF.f,(k,v)=>{OF.f[k]=v;OF.page=0;OF.sel.clear();render()},(k,d,v)=>filteredOrders({...OF.f,[k]:d.type==='multi'?[v]:v}).length);
  $('#oSort').onchange=e=>{OF.sort=e.target.value;render()};
  $('#viewsBtn').onclick=e=>{e.stopPropagation();viewsMenu(e.currentTarget)};
  const ca=$('#fClearAll');if(ca)ca.onclick=()=>{OF.f=OF_EMPTY();OF.q='';OF.page=0;render()};
  const sv=$('#saveView');if(sv)sv.onclick=saveViewModal;
  const cq=document.querySelector('[data-clrq]');if(cq)cq.onclick=()=>{OF.q='';render()};
  $('#selAll').onchange=e=>{document.querySelectorAll('.sel').forEach(c=>e.target.checked?OF.sel.add(c.dataset.id):OF.sel.delete(c.dataset.id));render()};
  document.querySelectorAll('tbody tr.click').forEach(tr=>tr.onclick=e=>{
    const id=tr.dataset.id;
    if(e.target.closest('.sel')){e.target.checked?OF.sel.add(id):OF.sel.delete(id);render();return}
    const q=e.target.closest('[data-q]');if(q){q.dataset.q==='track'?location.hash='order-'+id+'-tracking':mockAction('Print label');return}
    if(e.target.closest('.rowmenu')){e.stopPropagation();orderMenu(e.target.closest('.rowmenu'),id);return}
    location.hash='order-'+id});
  document.querySelectorAll('.ocard').forEach(c=>c.onclick=()=>location.hash='order-'+c.dataset.id);
}

/* order detail */
V.order=(id,tab='details')=>{
  const o=S.orders.find(x=>x.id===id);if(!o)return emptyState('Order not found','It may have been removed.',`<a class="btn" href="#orders">Back to orders</a>`);
  const st=o.status==='Canceled'?-1:STAGE[o.status],back=['Returning to you','Returned'].includes(o.status);
  const stages=[["Created","doc"],["Collected","box"],["On the way","truck"],[back?"Returned":"Delivered","done"]];
  const events=[["Order created",o.created],["Collected from your warehouse",new Date(+o.created+4*36e5)],["Sorted at Cairo hub",new Date(+o.created+DAY)],["Out for delivery",new Date(+o.created+1.4*DAY)],
    ...(o.attempts>1||['Awaiting your action','Rescheduled','Returned','Returning to you'].includes(o.status)?[[`Delivery attempt failed: ${o.reason.toLowerCase()}`,new Date(+o.created+1.6*DAY)]]:[]),
    [o.status==='Delivered'?'Delivered to '+o.name.split(' ')[0]:o.status==='Returned'?'Returned to your warehouse':'Now: '+o.status.toLowerCase(),o.updated]].slice(0,Math.max(st,0)+2).reverse();
  const fp=feeParts(o.size,o.zone,o.type,o.cod,o.open);
  return `<div><a class="btn ghost sm" href="#orders">${icon('back',14)} All orders</a></div>
  ${head(`${o.name}`,`<span class="mono">#${o.id}</span> · ${o.type} · ${o.size} · created ${fmtDate(o.created)}, ${fmtTime(o.created)}`,`${pill(o.status)}<button class="btn" onclick="summaryModal('${o.id}')">${icon('sparkle',16)} Summary</button><button class="btn" onclick="mockAction('Print label')">${icon('print',16)} Label</button><button class="icon-btn" id="odMenu" aria-label="More actions">${icon('dots')}</button>`)}
  <div class="card card-b"><div class="tracker ${back?'back':''}" style="--p:${Math.max(st,0)/3}">${stages.map(([s,i],k)=>`<div class="tstep ${k<st||(k===st&&st===3)?'done':''} ${k===st&&st<3?'now':''}"><span class="nd">${icon(i,20)}</span><b>${s}</b><span>${k<=st?fmtDate(new Date(+o.created+k*.45*DAY)):k===3?'Expected '+rel(o.eta).toLowerCase():'—'}</span></div>`).join('')}</div></div>
  ${['Awaiting your action','Unclear address'].includes(o.status)?`<div class="card" style="border-color:var(--bad-fg)"><div class="attn-row" style="border:0"><span class="attn-ic">${icon('alert',18)}</span><div class="cell2"><b>The courier is waiting for your decision</b><span>${o.status==='Unclear address'?'They can\'t find the address.':o.reason+'.'} Attempt ${Math.max(o.attempts,1)} of 3.</span></div><div class="row" style="gap:6px">${o.status==='Unclear address'?`<button class="btn sm primary" onclick="resolve('${o.id}','address')">Fix address</button>`:`<button class="btn sm primary" onclick="resolve('${o.id}','reschedule')">Reschedule</button>`}<button class="btn sm" onclick="resolve('${o.id}','return')">Return to me</button></div></div></div>`:''}
  ${tabsHtml([["details","Details"],["tracking","Tracking & messages"]],tab,'data-odtab')}
  ${tab==='tracking'?`<div class="grid g2"><div class="card"><div class="card-h b"><h2>Timeline</h2></div><div class="card-b timeline">${events.map(([t,d])=>`<div class="tl"><i></i><div class="cell2"><b>${t}</b><span>${fmtDate(d)} · ${fmtTime(d)}</span></div></div>`).join('')}</div></div>
    <div class="card" style="overflow:hidden"><div class="card-h b"><h2 class="grow">Customer messages</h2><div class="seg"><button class="on">Messages</button><button>Calls</button><button>SMS</button></div></div><div class="chat"><div class="msg">Hi ${o.name.split(' ')[0]}, your order from Nile Threads is on its way with Shiply. Reply 1 to confirm or 2 to pick another day.</div><div class="msg me">1</div><div class="msg">Thanks! Your courier will call before arriving.</div></div></div></div>`
  :`<div class="split"><div class="grid">
    <div class="card"><div class="card-h b"><h2 class="grow">Customer</h2><span class="pill p-ok">Usually accepts deliveries</span></div><div class="card-b kv">
      <div><span>Name</span><b>${o.name}</b></div><div><span>Phone</span><span class="num">${o.phone}</span></div><div><span>Address</span>${o.area}, ${o.gov}</div><div><span>Building · floor · apt</span>12 · 3 · 7</div></div></div>
    <div class="card"><div class="card-h b"><h2>Shipment</h2></div><div class="card-b kv">
      <div><span>Size</span>${o.size}</div><div><span>Items</span>${o.items}</div><div><span>Can open package</span>${o.open?'Yes':'No'}</div><div style="grid-column:1/-1"><span>Description</span>${o.items}× ${o.desc}</div><div><span>Return location</span>Main warehouse · Nasr City</div><div><span>Your reference</span><span class="mono">${o.ref}</span></div></div></div>
    <div class="card"><div class="card-h b"><h2>Delivery</h2></div><div class="card-b kv">
      <div><span>Attempts</span>${o.attempts} of 3</div><div><span>Expected</span>${rel(o.eta)}</div><div><span>Confirmed by customer</span>Yes, by message</div><div><span>Customer rating</span><span class="subtle">Not rated yet</span></div></div></div>
  </div>
  <div class="grid">
    <div class="card stat money"><span class="k">Cash to collect</span><span class="v">${o.cod?Number(o.cod).toLocaleString():'0'}<small> EGP</small></span><div class="lines small"><div><span>Payout</span><b>${o.payout}</b></div><div><span>Cash cycle</span><b>${fmtDate(new Date(+o.eta+DAY))}</b></div></div></div>

      <div><span class="muted">Shipping (${o.zone})</span><span>${egp(fp.base)}</span></div>${fp.openFee?`<div><span class="muted">Open package</span><span>${egp(fp.openFee)}</span></div>`:''}${fp.codFee?`<div><span class="muted">1% collection fee</span><span>${egp(fp.codFee)}</span></div>`:''}<div><span class="muted">VAT 14%</span><span>${egp(fp.vat)}</span></div><div class="total"><span>Total</span><span>${egp(fp.total)}</span></div></div></div>
    <div class="card"><div class="card-h b"><h2>Team notes</h2></div><div class="card-b"><textarea class="input" rows="3" placeholder="Only your team sees this" aria-label="Team note"></textarea><button class="btn sm" style="margin-top:10px" onclick="toast('Note saved')">Save note</button></div></div>
  </div></div>`}`;
};
function summaryModal(id){const o=S.orders.find(x=>x.id===id);
  if(LANG==='ar'){const tr=x=>trText(x);modal('Order summary',`<p style="margin:0;font-size:15px;line-height:1.8">طلب ${tr(o.type)} لـ <b>${o.name}</b> في ${tr(o.area)}، ${tr(o.gov)}. ${o.status==='Delivered'?`تم التوصيل في المحاولة ${o.attempts}.`:`الحالة الآن: <b>${tr(o.status)}</b> بعد ${o.attempts} محاولات.`} ${o.cod?`المطلوب تحصيله ${o.cod.toLocaleString('en-US')} ج.م، والتحويل للتاجر: ${tr(o.payout)}.`:'مدفوع مسبقًا، لا يوجد تحصيل.'}</p>`);return}
  modal('Order summary',`<p style="margin:0;font-size:15px;line-height:1.6">${o.type} order for <b>${o.name}</b> in ${o.area}, ${o.gov}. ${o.status==='Delivered'?`Delivered on try ${o.attempts}.`:`Currently <b>${o.status.toLowerCase()}</b> after ${o.attempts} ${o.attempts===1?'try':'tries'}.`} ${o.cod?`${egp(o.cod)} to collect; payout ${o.payout.toLowerCase()}.`:'Prepaid, nothing to collect.'}</p>`)}
function bindOrder(id){
  document.querySelectorAll('[data-odtab]').forEach(b=>b.onclick=()=>location.hash='order-'+id+(b.dataset.odtab==='tracking'?'-tracking':''));
  const m=$('#odMenu');if(m)m.onclick=e=>{e.stopPropagation();orderMenu(m,id)};

function bindSegs(){document.querySelectorAll('.seg').forEach(s=>s.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.dataset.keep)return;s.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))}))}

/* create order */
const CO_EMPTY=()=>({type:'Deliver',size:'Small',open:false,cod:'',area:'',insure:false,value:'',phone:'',name:'',addr:'',picks:[],track:'',tracked:'',cashDir:'collect'});
let CO=CO_EMPTY();
const TYPES=[["Deliver","Send to a customer","truck"],["Pick & Choose","Customer keeps what they like","sparkle"],["Exchange","Swap an item at the door","undo"],["Return","Collect an item from a customer","back"],["Sign & Return","Bring back a signed copy","doc"],["Cash collection","Collect or hand over cash","coin"]];
const insFee=()=>CO.insure&&+CO.value?Math.round(+CO.value*0.01*100)/100:0;
function trackedField(label){
  const o=CO.tracked&&S.orders.find(x=>x.id===CO.tracked);
  return `<div class="field"><label for="cTrack">${label}</label><div class="row" style="flex-wrap:nowrap"><input id="cTrack" class="input mono" placeholder="10-digit order number" value="${esc(CO.track)}"><button type="button" class="btn" id="trApply">Apply</button></div>
    ${o?`<span class="hint" style="color:var(--ok-text)">${icon('check',13,2.6)} Filled from order ${o.id}: ${o.name}, ${o.area}</span>`:`<span class="hint">Fills the customer from that order. Try ${S.orders[0].id}.</span>`}</div>`;
}
function pkgCard(){
  const t=CO.type;
  if(t==='Cash collection')return `<div class="card"><div class="card-h"><span class="sec-num">2</span><h2 class="grow">Cash</h2></div><div class="card-b grid" style="padding-top:0">
    <div class="seg" id="cashDir"><button type="button" data-keep="1" data-cd="collect" class="${CO.cashDir==='collect'?'on':''}">Collect cash from customer</button><button type="button" data-keep="1" data-cd="give" class="${CO.cashDir==='give'?'on':''}">Give cash to customer</button></div>

function bindCreate(){
  const keep=()=>{const v={};document.querySelectorAll('#coForm input,#coForm textarea,#coForm select').forEach(el=>{if(el.id&&el.type!=='file')v[el.id]=el.type==='checkbox'?el.checked:el.value});return v};
  const restore=v=>Object.entries(v).forEach(([k,val])=>{const el=document.getElementById(k);if(!el)return;el.type==='checkbox'?el.checked=val:el.value=val});
  const sync=()=>Object.assign(CO,{cod:$('#cCod').value,area:$('#cArea').value,open:$('#cOpen').checked,value:$('#cVal').value,insure:$('#cIns').checked,phone:$('#cPhone').value,name:$('#cName').value,addr:$('#cAddr').value});
  const rerender=(focusId)=>{const v=keep();sync();const y=scrollY;render();restore(v);scrollTo(0,y);if(focusId){const el=document.getElementById(focusId);el?.focus();if(el&&el.setSelectionRange&&el.type==='text')el.setSelectionRange(el.value.length,el.value.length)}};
  $('#coType').onchange=e=>{CO.type=e.target.value;rerender()};
  const sz=$('#coSize');if(sz)sz.onchange=e=>{CO.size=e.target.value;rerender()};
  document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{const id=b.dataset.pick,i=CO.picks.indexOf(id);i>=0?CO.picks.splice(i,1):CO.picks.length<3&&CO.picks.push(id);rerender()});
  document.querySelectorAll('[data-cd]').forEach(b=>b.onclick=()=>{CO.cashDir=b.dataset.cd;rerender()});
  const ta=$('#trApply');if(ta)ta.onclick=()=>{const v=$('#cTrack').value.trim(),o=S.orders.find(x=>x.id===v);CO.track=v;
    if(!o){$('#cTrack').classList.add('err');toast('No order with that number');return}
    CO.tracked=o.id;rerender();$('#cName').value=o.name;$('#cArea').value=areaKey(o);$('#cAddr').value='12 '+o.area+' St, building 4';rerender()};
  ['cCod','cOpen','cArea','cIns','cVal'].forEach(id=>$('#'+id)?.addEventListener('change',()=>rerender()));
  $('#cPhone').addEventListener('input',e=>{const d=e.target.value.replace(/\D/g,'');if(d.length===11&&CUSTOMERS[d])rerender('cPhone')});
  const uk=$('#useKnown');if(uk)uk.onclick=()=>{const k=CUSTOMERS[$('#cPhone').value.replace(/\D/g,'')];$('#cName').value=k.name;$('#cAddr').value=k.addr;$('#cArea').value=k.area;rerender()};
  document.querySelectorAll('#coForm .input').forEach(el=>el.addEventListener('input',()=>{el.classList.remove('err');el.parentElement.querySelector('.err-msg')?.remove()}));
  const save=again=>{
    document.querySelectorAll('.err-msg').forEach(e=>e.remove());let first=null;
    const need=[['cPhone',v=>v.replace(/\D/g,'').length===11,'Enter an 11-digit mobile number'],['cName',v=>v.trim(),'Enter the customer\'s name'],['cAddr',v=>v.trim().length>4,'Enter the street and building'],['cArea',v=>AREAS.some(a=>areaKey(a)===v),'Pick an area from the list']];
    need.forEach(([id,ok,msg])=>{const el=$('#'+id);if(!ok(el.value)){el.classList.add('err');el.insertAdjacentHTML('afterend',`<span class="err-msg">${msg}</span>`);first=first||el}});
    if(!first&&CO.type==='Pick & Choose'&&!CO.picks.length){toast('Choose at least one product');$('#coPicks')?.scrollIntoView({block:'center',behavior:'smooth'});return}
    if(!first&&CO.type==='Cash collection'&&!(+$('#cCod').value>0)){const el=$('#cCod');el.classList.add('err');el.insertAdjacentHTML('afterend','<span class="err-msg">Enter the amount</span>');first=el}
    if(first){first.focus();first.scrollIntoView({block:'center',behavior:'smooth'});return}
    sync();const ar=AREAS.find(a=>areaKey(a)===CO.area),ph=CO.phone.replace(/\D/g,'');
    const o={id:String(1000000000+Math.floor(Math.random()*8999999999)),type:CO.type,size:CO.size,name:CO.name.trim(),phone:`+20 ${ph.slice(1,4)} ••• ${ph.slice(-4)}`,...ar,cod:CO.type==='Return'||(CO.type==='Cash collection'&&CO.cashDir==='give')?0:+CO.cod||0,status:'New',attempts:0,open:CO.open||CO.type==='Pick & Choose',printed:false,payout:'Not yet',created:new Date(TODAY),eta:new Date(+TODAY+2*DAY),updated:new Date(TODAY),items:CO.type==='Pick & Choose'?CO.picks.length:+($('#cCount')?.value)||1,desc:CO.type==='Pick & Choose'?CO.picks.map(id=>S.products.find(p=>p.id===id)?.name).join(', '):CO.type==='Cash collection'?(CO.cashDir==='give'?'Hand cash to customer':'Collect cash'):$('#cDesc')?.value||'—',ref:$('#cRef')?.value||'—',reason:''};
    o.fee=fee(o.size,o.zone,o.type,o.cod,o.open);S.orders.unshift(o);
    CO={...CO_EMPTY(),type:CO.type};
    toast(`Order ${o.id} created for ${o.name}`,()=>{S.orders.shift();render()});
    if(again){render();scrollTo(0,0);$('#cPhone').focus()}else{OF.tab='all';location.hash='orders'}
  };
  $('#coForm').onsubmit=e=>{e.preventDefault();save(false)};$('#coAnother').onclick=()=>save(true);
}

const AN=(()=>{let s=11;const r=()=>(s=(s*16807)%2147483647)/2147483647;const out=[];
  for(let i=179;i>=0;i--){const d=new Date(TODAY-i*DAY),wd=d.getDay(),t=179-i;
    const created=Math.max(5,Math.round(10+t*.05+(wd===5?-7:wd===6?-2:0)+r()*7));

    out.push({d,created,delivered,failed,returned:Math.round(failed*(.5+r()*.25)),cash:Math.round(delivered*(540+r()*280)),days:1.25+r()*.6+(wd===4?.3:0)})}
  return out})();
const GOVS=[["Cairo",.36,.93,1.2],["Giza",.19,.91,1.3],["Alexandria",.12,.88,1.8],["Dakahlia",.06,.86,2.1],["Sharqia",.05,.84,2.2],["Gharbia",.04,.86,2.0],["Ismailia",.03,.87,2.1],["Red Sea",.04,.79,3.0],["Assiut",.04,.74,3.3],["Sohag",.03,.72,3.5],["Aswan",.04,.68,3.8]].map(([g,share,rate,days])=>({g,share,rate,days}));

const OTYPE={all:1,Deliver:.86,Exchange:.06,Return:.05,'Cash collection':.03};
const REASONS=[["Customer refused the package",.39],["Customer asked to postpone",.17],["Phone number not reachable",.13],["Customer wanted to open it first",.11],["Customer changed the address",.09],["Address not clear",.07],["Customer not at the address",.04]];

}

function cashChart(a){
  const size=a.length<=7?1:a.length<=30?3:7,buckets=[];
  for(let i=0;i<a.length;i+=size){const w=a.slice(i,i+size),cash=sumK(w,'cash');buckets.push({from:w[0].d,to:w[w.length-1].d,cash,fees:cash*.113})}
  const W=560,H=190,L=44,B=24,T=10,n=buckets.length,max=niceMax(Math.max(...buckets.map(b=>b.cash))),step=(W-L-6)/Math.max(1,n-1);
